name: Plynt installers
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths: ['src/**', 'tests/**', 'mobile/android/**', 'package*.json', '.github/workflows/build.yml']
permissions:
  contents: read
jobs:
  build:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            args: --win --x64
          - os: macos-latest
            platform: macos
            args: --mac --x64 --arm64
          - os: ubuntu-22.04
            platform: linux
            args: --linux --x64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm test
      - name: Native desktop fixture checks
        if: runner.os != 'Linux'
        run: node tests/run-cross-platform.cjs
      - name: Native Linux fixture checks
        if: runner.os == 'Linux'
        run: xvfb-run -a node tests/run-cross-platform.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks-${{ matrix.platform }}
          path: |
            test-output/features-*.json
            test-output/09-*.png
            test-output/10-*.png
            test-output/11-*.png
      - run: npm run dist -- ${{ matrix.args }}
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
  android-preview:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install official Android build packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Build compatibility APK
        env:
          PLYNT_ANDROID_DEBUG_KEY: ${{ runner.temp }}/plynt-debug.keystore
        run: ANDROID_SDK_ROOT="$ANDROID_HOME" python mobile/android/build.py
      - name: Prepare Android UI test
        run: |
          python -m pip install websocket-client
          sudo chmod 666 /dev/kvm
      - name: Native Android fixture checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python tests/android-smoke.py dist/android/plynt-*-android-test.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks-android
          path: test-output/android/
      - uses: actions/upload-artifact@v4
        with:
          name: installers-android
          if-no-files-found: error
          path: dist/android/plynt-*-android-test.apk
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, android-preview]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true
      - name: Publish test release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$RELEASE_TAG" = "v$(node -p 'require("./package.json").version')"
          test -f "docs/releases/$RELEASE_TAG.md"
          cd installers
          find . -maxdepth 1 -type f ! -name '*-android-test.apk' ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          gh release create "$RELEASE_TAG" ./*.exe ./*.zip ./*.dmg ./*.deb ./*.AppImage ./SHA256SUMS.txt --verify-tag --title "Plynt $RELEASE_TAG" --prerelease --notes-file "../docs/releases/$RELEASE_TAG.md"
