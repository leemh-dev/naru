name: Naru desktop installers
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths: ['src/**', 'tests/**', 'package*.json', '.github/workflows/build.yml']
permissions:
  contents: read
jobs:
  build:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            args: --win --x64
          - os: macos-latest
            platform: macos
            args: --mac --x64 --arm64
          - os: ubuntu-22.04
            platform: linux
            args: --linux --x64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm test
      - run: npm run dist -- ${{ matrix.args }}
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true
      - name: Publish test release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd installers
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          gh release create "$RELEASE_TAG" ./* --title "Naru $RELEASE_TAG" --prerelease --notes "Naru 데스크톱 시험판입니다. Windows x64, macOS Intel/Apple Silicon, Linux x64 배포 파일을 제공합니다. 코드 서명·Apple 공증은 하지 않았습니다. 빌드 성공과 실제 서비스 로그인 후 동작 검증은 별개입니다. 진단 보고서는 PC에만 기록하며 메뉴에서 직접 내보냅니다. 자세한 사용 방법과 검증 범위는 저장소 README를 확인해 주세요."
