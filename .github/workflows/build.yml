name: Desktop installers
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths: ['src/**', 'tests/**', 'package*.json', '.github/workflows/build.yml']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            args: --win --x64
          - os: macos-latest
            platform: macos
            args: --mac --x64 --arm64
          - os: ubuntu-22.04
            platform: linux
            args: --linux --x64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm test
      - run: npm run dist -- ${{ matrix.args }}
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true
      - name: Publish test release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          find installers -type f -print0 | sort -z | xargs -0 sha256sum > installers/SHA256SUMS.txt
          gh release create "$RELEASE_TAG" installers/* --title "$RELEASE_TAG · Desktop preview" --prerelease --notes "Experimental Windows, macOS and Linux installers. Unsigned builds. Authenticated AI service compatibility requires user testing. Diagnostic reports are local and manually exported."
